services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mnemiq
      POSTGRES_PASSWORD: mnemiq
      POSTGRES_DB: acme
    ports:
      - "${MNEMIQ_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemiq -d acme"]
      interval: 2s
      timeout: 3s
      retries: 20

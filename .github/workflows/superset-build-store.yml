name: superset-build-store
# Its own workflow, not a job in ci.yml, for the reason mcp-2x and postgres-keys are: `test_ci_runs_what_it_claims`
# replays ci.yml's one pytest invocation, and a second would make that ambiguous.
on:
  # ci.yml's events, for ci.yml's reasons: see the comment on its `on`.
  push:
    branches: [main]
  pull_request:
# A workflow inherits no floor from another file, so this one declares ci.yml's.
permissions:
  contents: read
jobs:
  # The tests of the Superset dashboard builder's store: each build's plan, steps and leases, and each dashboard's
  # measure list, in a real Postgres, including the guard that reads the store's columns and every jsonb key from it
  # and finds no value kept there, and two connections racing to claim one step. They need a server to make their own
  # schemas on, and ci.yml's `unit` gives them none, so there they skip. Here they get a Postgres of their own, and
  # MNEMIQ_TEST_BUILD_STORE_REQUIRED turns a missing DSN into a failure, so this job cannot pass by skipping them.
  # The builder's tests run here too: its builds on this store, beside the ones on the in-memory store, with the
  # store's own gate.
  #
  # From the network it needs what `unit` needs (the actions, Python packages through uv) and the `postgres:16` image,
  # from Docker Hub.
  superset-build-store:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # No password, so nothing to keep secret, and a fork's pull request -- which receives no secrets -- runs this
          # job exactly as a branch here does. The server lives as long as the job and holds nothing but the schemas
          # the tests make and drop.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Over TCP, not the socket: on its first start the image initialises through a temporary server that listens
        # on the socket alone, and a socket check passes against it just before it stops. The tests connect over TCP,
        # so TCP is what must be ready.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # `dev` alone, for pytest, and uvicorn, which serves the builder's tests their stand-in Superset: the store and
      # both modules import nothing else outside the core dependencies, which carry psycopg, mcp and duckdb.
      - run: uv sync --extra dev
      # `-ra`, not `-rs`: an explicit `-r` replaces pytest's default `fE`, and a summary that lists skips but drops
      # failures and errors would hide the lines this job exists to show.
      - run: uv run pytest -q -ra tests/test_superset_build_store.py tests/test_superset_builder.py tests/test_superset_conversation_store.py
        # tests/test_superset_build_store.py reads these two lines, by the names its gate reads, and fails in `unit`
        # if either goes missing or is renamed on one side only.
        env:
          MNEMIQ_TEST_BUILD_STORE_DSN: postgresql://postgres@127.0.0.1:5432/postgres
          # The tests read `1`, `0` or nothing here and fail on anything else, so a `true` fails the job rather than
          # reading as unset and letting it pass by skipping.
          MNEMIQ_TEST_BUILD_STORE_REQUIRED: "1"

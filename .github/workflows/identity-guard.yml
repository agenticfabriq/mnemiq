name: identity-guard
# Who each commit of a pull request says made it, for every pull request, a fork's included.
#
# repo-guard.yml checks commit identities against a private list held in a repository secret, but a fork's pull request
# receives no secret in its own runs, so there the check is skipped: a commit forged with a listed identity could reach
# main through a fork. This job runs under pull_request_target, which runs THIS repository's code with its secrets, and
# it is safe only because it never touches the fork's code:
#   - it checks out the base commit, never the pull request's head, and keeps no credentials in the checkout;
#   - it reads the pull request's commit identities from GitHub's API and passes them to the base's
#     scripts/repo-guard.sh on stdin; nothing the pull request controls is interpolated into a shell command;
#   - it prints only a commit's short SHA and "author" or "committer" on a hit, never the identity or the pattern.
# The API lists at most 250 commits; a longer pull request cannot be checked whole and fails.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check each commit's author and committer against the private identity list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_GUARD_IDENTITY_EXPECTED: ${{ github.event.pull_request.commits }}
          REPO_GUARD_IDENTITY_PATTERNS: ${{ secrets.REPO_GUARD_IDENTITY_PATTERNS }}
          REPO_GUARD_IDENTITY_REQUIRED: "1"
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100" \
            --jq '.[] | {sha, a: (.commit.author.name + " <" + .commit.author.email + ">"), c: (.commit.committer.name + " <" + .commit.committer.email + ">")}' \
            | python3 -I -c 'import json, sys; sys.stdout.buffer.write(b"".join(("%s\0%s\0%s\0" % (r["sha"], r["a"], r["c"])).encode() for r in map(json.loads, sys.stdin) if r))' \
            | bash scripts/repo-guard.sh --identities

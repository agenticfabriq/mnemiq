name: mcp-2x
# Its own workflow, not a job in ci.yml: `test_ci_runs_what_it_claims` replays ci.yml's one pytest
# invocation, and a second would make that ambiguous.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The lock pins mcp 1.x, but the cap admits 2.x (M121), and 2.x hides an unexpected tool
  # exception from the client -- the reason `mcp/server.py` raises setup failures as ToolError. On
  # 1.x every exception's message reaches the client anyway, so only a 2.x run checks that path.
  mcp-2x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]" && uv pip install --upgrade "mcp>=2,<2.4"
      - run: uv pip freeze | grep -i '^mcp=='
      - run: .venv/bin/python -m pytest tests/test_mcp_startup.py -v

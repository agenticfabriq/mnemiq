name: mcp-2x
# Its own workflow, not a job in ci.yml: `test_ci_runs_what_it_claims` replays ci.yml's one pytest
# invocation, and a second would make that ambiguous.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The lock pins mcp 1.x, but the cap admits 2.x (M121), and from 2.1 an unexpected tool exception
  # is hidden from the client -- the reason `mcp/server.py` raises setup failures as ToolError. On
  # 1.x and 2.0 its message reaches the client anyway (measured on 2.0.0, 2.1.0, 2.1.1, 2.2.0,
  # 2.3.0), so only a 2.1+ run checks that path: the upgrade below resolves the newest within the cap.
  mcp-2x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]" && uv pip install --upgrade "mcp>=2,<2.4"
      - run: uv pip freeze | grep -i '^mcp=='
      # The HTTP door's per-request identity too: 2.x moved its path and statelessness settings, which
      # `mcp/server.py` bridges, so only a 2.x run checks the bridge. And the Superset client, which
      # opens the transport by name and reads each response's HTTP status itself, because 2.x reports
      # an HTTP error as a JSON-RPC error that no longer says which status it was. The adapter's and
      # the grants' tests run that client joined to them, against the fake Superset.
      - run: .venv/bin/python -m pytest tests/test_mcp_startup.py tests/test_mcp_http_identity.py tests/test_superset_client.py tests/test_superset_adapter.py tests/test_superset_grants.py -v

name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # `ontology` carries rdflib, which tests/test_ontology_digest.py imports at
      # collection time; without it those tests error rather than skip.
      - run: uv sync --extra dev --extra ontology --extra oracle
      - run: uv run ruff check .
      - run: uv run pytest -m "not integration and not live_llm" -v

  workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      # `defaults.run.working-directory` governs `run:` steps only, never a `uses:` action.
      # Without this the action looks for `packageManager` in a root package.json that does
      # not exist, and fails with "No pnpm version is specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: workbench/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: workbench/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

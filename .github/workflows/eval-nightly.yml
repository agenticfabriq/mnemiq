# The accuracy gate. Separate from `ci` on purpose, and scheduled rather than per-PR.
#
# Why not per-PR, which is the stronger thing to want. Two reasons, and the first is written for
# where this repo is GOING rather than where it is: mnemiq is announced as open source and this
# repo is private today, so the fork argument does not bite yet -- but the day it goes public,
# GitHub stops exposing secrets to workflows triggered from a fork, and a per-PR gate would pass
# vacuously for exactly the contributors it most needs to check. That is a fail-open created by CI
# topology rather than by code, the same shape as the finding this job exists to close (M34), and
# it would arrive silently on the day of the flip rather than announcing itself. The second reason
# bites now: the eval needs a live model endpoint, and one Spider2 run logged 10 provider outages
# in 270 calls; a gate that goes red for an outage is a gate people learn to route around, which is
# how repo-guard's over-matching became a problem (M19).
#
# So: it runs nightly on the default branch and on demand, and a regression is caught within a
# day rather than blocked at merge. That trade is deliberate and is the weaker half of it.
#
# **For its first two runs it never once completed a comparison.** Both failed in about fifteen
# seconds on `set MNEMIQ_PG_DSN`, because the source database was reached for through a secret that
# was never set and could not have routed anywhere a runner can see. Nothing was gating while the
# ACME number moved four points below its baseline -- eight on the developer machine, half of which
# turned out to be that source's own contents. Two changes: the database is PROVISIONED here rather
# than reached for, so it needs no secret and cannot point somewhere unreachable; and "the gate
# could not run" is now its own named step, because the whole harm was that it and "accuracy
# regressed" were the same red X in a list nobody opens.
#
# Run 3 (2026-09-05, dispatched once the model secrets were set) is the first that ever compared
# anything: it armed, provisioned and seeded its own database, ran 30 cases in 5m34s and went red
# on `GATE FAILED: accuracy regressed: 88.0% < previous 96.0% - 2% tolerance`, quoted as printed.
#
# That red was mostly neither of the two things it looked like. Not a baseline from another source:
# the two `deferred_wrongly` cases were M84, a SELECT-star guard refusing the GOLD query, which
# four identical runs at 88.0/76.0 had already shown was no fluke. Fixed, and `deferred_wrongly` is
# 0 in every run since.
#
# The THIRD case that moved, `fire-count`, is model variance and nearly went into the record as
# progress. Across the twelve runs that have produced a comparison it is wrong in EIGHT. Three came
# in at 100.0/88.0 -- including one that passed against the 100.0 baseline while it was briefly
# recorded, which is the run hardest on this conclusion and is why it is named rather than left out
# of the tally. Then two at 96.0/84.0 with the case wrong again. Recording 100.0 against a tolerance
# that is a proxy for zero would redden roughly three nights in four, and every red would be read as
# a regression by whoever saw it.
#
# So the number CI reproduces is 96.0/84.0, and its counts (21/3/1/0) are byte-identical to the
# baseline recorded before any of this. **The re-record confirmed the old number rather than
# replacing it** -- the whole apparent 8-point regression was M84, and the source difference this
# exercise set out to absorb turned out not to exist. The 100.0 row is left in the file above the
# one that supersedes it, because a trend is a history and a sample that misled us is worth keeping
# visible. **The bar is the row with the newest `run_at`, not the largest number and not the last
# line** -- the JSON backend used to take `rows[-1]` by position, so leaving a higher row above a
# lower one meant any reordering of this file silently restored 100.0 as the level to beat, with
# nightly reds on `fire-count` as the only symptom. Both backends order by `run_at` now.

name: eval-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# One at a time. Two concurrent runs would compare against a baseline the other is mid-way
# through reasoning about.
concurrency:
  group: eval-nightly
  cancel-in-progress: false

# The dataset the ACME golden set is asked about: dbt-labs' semantic-layer benchmark, Apache-2.0,
# pinned to a commit. FETCHED rather than vendored -- 132K of CSV would be small enough to copy in,
# but copying a third-party corpus into a repo that will be public takes on redistribution and
# attribution that a pinned fetch does not, and the pin gives the same reproducibility.
env:
  ACME_DATASET_REPO: dbt-labs/semantic-layer-llm-benchmarking
  ACME_DATASET_REF: ac20c9292fa88ec44d30aeeae61ee41a51e31748

jobs:
  acme:
    runs-on: ubuntu-latest
    # The full run re-enriches the whole source before it asks 30 questions. The seeded source
    # is 29 objects -- the seeder creates tables only, never views; the flat "51" this comment gave was
    # the count profiled from a DEVELOPER database, which had accumulated mnemiq's own control
    # tables on top of ACME's. A number measured on one machine's drift is not a property of
    # the job.
    timeout-minutes: 90

    # Job scope for the NON-secret configuration only. The model credentials stay on the two steps
    # that need them: hoisting them here would put the API key into the environment of `uv sync`,
    # which runs third-party build backends, and of the dataset checkout -- steps that have no use
    # for it. A duplicated list of three names across two steps is the smaller risk, and the reason
    # it is duplicated is written at the preflight so the next reader does not "tidy" it back.
    env:
      # The service container, not a secret pointing somewhere unroutable.
      MNEMIQ_PG_DSN: postgresql://postgres:postgres@localhost:5432/acme
      MNEMIQ_SOURCE_ID: acme

    # The source database, stood up here rather than reached for. It used to come from an
    # `MNEMIQ_ACME_PG_DSN` secret pointing at a host the runner could not route to, which is half
    # of why this job's first two runs completed no comparison. A service container needs no secret
    # and cannot drift away from the schema the seeder writes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: acme
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev --extra ontology

      # ITS OWN STEP, and named, because the whole defect this job carries is that "the gate could
      # not run" and "accuracy regressed" were the same red X in the Actions list. Now the FAILING
      # STEP NAME says which: this one means unarmed, the gate step below means regressed. Nobody
      # has to open a log to tell them apart.
      #
      # It fails rather than skipping. A green tick for a gate that did not run is the M34 shape
      # itself -- a control reporting success for work it never did -- and this job exists to
      # close that, not to reproduce it one level out.
      - name: "Preflight: the gate is armed"
        # These three are repeated on the gate step below, deliberately. Declaring them once at job
        # level would scope a model credential to every step in the job, including dependency
        # resolution and a third-party checkout. If a fourth requirement is ever added to the gate,
        # add it in THREE places -- this `env:`, the loop below, and the gate step's `env:`.
        # The drift that invites is the lesser of the two risks, and naming all three is how
        # the next person gets it right.
        env:
          MNEMIQ_LLM_BASE_URL: ${{ secrets.MNEMIQ_LLM_BASE_URL }}
          MNEMIQ_LLM_API_KEY: ${{ secrets.MNEMIQ_LLM_API_KEY }}
          MNEMIQ_LLM_MODEL: ${{ secrets.MNEMIQ_LLM_MODEL }}
        shell: bash
        run: |
          missing=()
          # BASE_URL and API_KEY only. `LLMClient.__init__` raises on those two; `llm_model`
          # is filled with `DEFAULT_MODEL` by `Settings._fill_defaults`, so requiring it here
          # would hold the gate dark for a secret the run does not need -- this job's own
          # failure in miniature, refusing to run for a reason that is not real.
          for name in MNEMIQ_LLM_BASE_URL MNEMIQ_LLM_API_KEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "## THE ACCURACY GATE IS NOT ARMED"
              echo
              echo "This run compared nothing. It is **not** a regression."
              echo
              echo "Missing repository secrets: \`${missing[*]}\`"
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions."
              echo
              echo "MNEMIQ_LLM_MODEL is optional -- Settings fills a default. The source"
              echo "database needs no secret: this job provisions and seeds its own."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "armed: model endpoint configured; database provisioned by this job"

      # The corpus, at the pinned commit. `path:` keeps it out of the checkout the tests import.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.ACME_DATASET_REPO }}
          ref: ${{ env.ACME_DATASET_REF }}
          path: .acme-dataset

      - name: Seed ACME into the service database
        env:
          MNEMIQ_ACME_DATA_DIR: .acme-dataset/ACME_Insurance
        shell: bash
        run: |
          set -o pipefail
          uv run python -m scripts.seed_acme | tee -a "$GITHUB_STEP_SUMMARY"

      # `--gate`, never `--record`. The nightly is a READER: it compares and fails, and it
      # never writes the baseline. A job that recorded its own result would restore the ratchet
      # removed in the code -- a regression fails once, becomes the baseline, and passes
      # forever after. Accepting a new accuracy level is a human commit of evals/trend.json,
      # reviewed like any other change to what we claim.
      #
      # It also fails when it CANNOT compare: no baseline, or a trend store it could not read.
      # Both used to pass, which is why nothing noticed a published number drifting 16 points.
      - name: Gate ACME accuracy against the recorded baseline
        env:
          MNEMIQ_LLM_BASE_URL: ${{ secrets.MNEMIQ_LLM_BASE_URL }}
          MNEMIQ_LLM_API_KEY: ${{ secrets.MNEMIQ_LLM_API_KEY }}
          MNEMIQ_LLM_MODEL: ${{ secrets.MNEMIQ_LLM_MODEL }}
        # `set -o pipefail` is load-bearing, not hygiene. Actions runs `bash -e` without it, so
        # a pipeline reports the exit status of its LAST command -- `tee` -- and a failing gate
        # would be reported as a passing step. That is this finding's own failure mode, one
        # layer out, and it nearly shipped in the change that made the gate able to fail.
        shell: bash
        run: |
          set -o pipefail
          uv run mnemiq eval --gate | tee -a "$GITHUB_STEP_SUMMARY"

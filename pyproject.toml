[project]
name = "mnemiq"
version = "0.1.0.dev0"
description = "Open-source enterprise data-agent engine"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  # Capped below 2 (2026-11-03): the deciders model how DuckDB binds names and converts values, measured on
  # 1.5, and on 2.0.0 the suite fails 130 tests, 113 of them its deprecated lambda arrow. Raise it when the
  # deps canary passes past it.
  "duckdb>=1.2,<2",
  "psycopg[binary]>=3.2",
  "openai>=1.40",
  # Imported directly by mnemiq.llm (the client, the embedder and the window check build their own httpx.Client),
  # so declared, not borrowed: openai brought it in until openai 3 dropped it, and from then a plain install could
  # not import the model client. tests/test_core_dependencies.py holds every load-time import to this list.
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pytz",  # DuckDB needs it to profile Postgres timestamptz columns (else profiling throws)
  # Capped at the newest release the suite passes on (M121): 30.29, the version the lock pins. The cap
  # held at 30.12 while the scopes code read shapes that changed after it: a write's subquery has a
  # parent scope from 30.17 (the scopes chain walk now includes it), `union_scopes` is
  # `set_operation_scopes` from 30.19, and `SortArray` is `ArraySort` by 30.29 (both read by either
  # name). Earlier breaks, since handled: 30.17 the write path's table walk (a write whose scope misses
  # a table fails closed, #66), 30.19 the fan-out check's grouping reads (now by node type), and 30.22
  # removed `qualify_columns(infer_schema=)` (the eval criterion passes it only where accepted). Known
  # from 30.13 on, failing closed: a VALUES branch of a set operation inside a CTE is refused where
  # 30.12 approved it -- none of 9,687 gold queries has the shape. Raise the cap when the deps-canary
  # job passes past it.
  "sqlglot>=25.34.1,<30.30",
  "pyarrow>=17",
  "cachetools>=5",
  # Capped at the newest release the suite has passed on (M121). 2.x renamed FastMCP to MCPServer and,
  # from 2.1, hides an unexpected tool exception from the client; `mcp/server.py` reads either version and raises
  # setup failures as the installed ToolError so their instruction still arrives.
  "mcp>=1.28,<2.4",
  # The token verifiers in `mnemiq.auth`. Declared rather than borrowed from `mcp`: a security check cannot rest on
  # another package's choice of dependencies. The floor is mcp's own; capped at the newest release the suite passes
  # on (M121), and `crypto` brings the RSA and EC support an identity provider's keys need.
  "pyjwt[crypto]>=2.10.1,<2.16",
]

[project.optional-dependencies]
# `oracledb` is here as well as in the `oracle` extra, and deliberately: the database-free Oracle
# tests guard the read-only controls, and behind an `importorskip` a missing driver turned them
# into silent SKIPPED lines under a green build. In thin mode it needs no Oracle client
# libraries, so the cost of installing it for every developer is a pure-python wheel.
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.115", "uvicorn>=0.30", "oracledb>=2,<5"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
# Oracle is a v1 target and an OPTIONAL extra, not a core dependency: only an Oracle
# deployment needs the driver, and `oracledb` in thin mode needs no Oracle client libraries.
# Capped below 5, the release after 4.0.2 being 26.0 (2026-11-03): on 26.1.0 the adapter's driver error
# table misses a code (`test_source_unavailable_is_not_a_rejection`). Raise it with the canary.
oracle = ["oracledb>=2,<5"]
# The warehouse benchmark path: any script under `scripts/` that connects to Snowflake or
# Databricks. Stated as a RULE rather than a list or a count, both of which this comment has
# already got wrong -- it named five scripts when far more needed the drivers, because every
# batch that added one had to remember to come back and edit prose. To see the current set:
#
#   grep -lE '\b(snowflake|databricks)' scripts/*.py
#
# Extras rather than core dependencies: only someone reproducing the vendor comparison needs a
# Databricks or Snowflake driver. They are declared because these scripts produced published
# numbers, and a `uv sync` that quietly prunes a driver turns every one of them into a
# ModuleNotFoundError at the first connect.
#
# `cryptography` and `requests` are DIRECT imports of `run_cortex.py` -- key-pair auth and the
# Cortex REST call. The connector happens to pull both today, which is exactly the reliance the
# paragraph above says not to take: a transitive dependency is not a promise.
databricks = ["databricks-sdk>=0.30", "databricks-sql-connector>=3"]
snowflake = ["snowflake-connector-python>=3", "cryptography>=42", "requests>=2.31"]
warehouse = [
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3",
    "snowflake-connector-python>=3",
    "cryptography>=42",
    "requests>=2.31",
    "sqlglot>=25",
]
ontology = [
    "rdflib>=7",
]

[project.scripts]
mnemiq = "mnemiq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: needs a live database (Postgres, Oracle via MNEMIQ_ORACLE_TEST_DSN, or MySQL via MNEMIQ_TEST_MYSQL_DSN)", "live_llm: needs a live LLM endpoint"]

[tool.ruff]
line-length = 100

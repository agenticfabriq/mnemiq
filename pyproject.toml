[project]
name = "mnemiq"
version = "0.1.0.dev0"
description = "Open-source enterprise data-agent engine"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "duckdb>=1.2",
  "psycopg[binary]>=3.2",
  "openai>=1.40",
  "pydantic>=2",
  "sqlglot>=25",
  "pyarrow>=17",
  "cachetools>=5",
  "mcp>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mnemiq = "mnemiq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: needs Postgres", "live_llm: needs a live LLM endpoint"]

[tool.ruff]
line-length = 100

[project]
name = "mnemiq"
version = "0.1.0.dev0"
description = "Open-source enterprise data-agent engine"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "duckdb>=1.2",
  "psycopg[binary]>=3.2",
  "openai>=1.40",
  "pydantic>=2",
  "pydantic-settings>=2",
  "pytz",  # DuckDB needs it to profile Postgres timestamptz columns (else profiling throws)
  "sqlglot>=25.34.1",
  "pyarrow>=17",
  "cachetools>=5",
  "mcp>=1.28",
]

[project.optional-dependencies]
# `oracledb` is here as well as in the `oracle` extra, and deliberately: the database-free Oracle
# tests guard the read-only controls, and behind an `importorskip` a missing driver turned them
# into silent SKIPPED lines under a green build. In thin mode it needs no Oracle client
# libraries, so the cost of installing it for every developer is a pure-python wheel.
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30", "oracledb>=2"]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
# Oracle is a v1 target and an OPTIONAL extra, not a core dependency: only an Oracle
# deployment needs the driver, and `oracledb` in thin mode needs no Oracle client libraries.
oracle = ["oracledb>=2"]
ontology = [
    "rdflib>=7",
]

[project.scripts]
mnemiq = "mnemiq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = ["integration: needs a live database (Postgres, or Oracle via MNEMIQ_ORACLE_TEST_DSN)", "live_llm: needs a live LLM endpoint"]

[tool.ruff]
line-length = 100

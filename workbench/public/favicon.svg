<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="mnemiq">
  <!--
    mnemiq: a Q inside brackets. The letter is the house (Agentic Fabriq); the brackets
    are this product, scope closing on what an identity may see.

    Ink follows the reader's theme. A favicon cannot inherit currentColor, so both values
    are declared here and swapped by the media query.
  -->
  <style>
    .m { stroke: #12161a; }
    @media (prefers-color-scheme: dark) { .m { stroke: #e8eaec; } }
  </style>
  <g class="m" fill="none" stroke-width="3.2" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M10 4H4v24h6M22 4h6v24h-6"/>
    <rect x="11.6" y="9.6" width="9" height="10.6"/>
    <path d="M17 17.4l5.2 5.6"/>
  </g>
</svg>
